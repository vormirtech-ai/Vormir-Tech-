name: Build Android APK

# Produces an installable APK of the Lavi billing system.
# The APK is attached to every run as an artifact, and to the GitHub Release
# when a v* tag is pushed.

on:
  push:
    branches: ['**']
    paths:
      - 'android/**'
      - 'billing-app/**'
      - '.github/workflows/android.yml'
  # Publishing a GitHub Release builds the APK and attaches it to that release,
  # which is the permanent download link to hand round.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Signing with your own key is optional. Add the four repository secrets
      # below and every build is signed with it, so updates install over the
      # previous version. Without them the build falls back to the standard
      # debug key, which still installs but cannot upgrade an existing install.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Release keystore ready."
          else
            echo "No KEYSTORE_BASE64 secret set — the APK will be debug-signed."
          fi

      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Name the APK
        id: apk
        run: |
          SRC=android/app/build/outputs/apk/release/app-release.apk
          test -f "$SRC" || { echo "APK not found at $SRC"; find android/app/build/outputs -name '*.apk'; exit 1; }
          VERSION=$(grep -m1 'versionName' android/app/build.gradle | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "${{ github.event_name }}" = "release" ]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          NAME="lavi-billing-v${VERSION}.apk"
          cp "$SRC" "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -la "$NAME"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: lavi-billing-apk
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error
          retention-days: 90

      - name: Attach the APK to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.name }}
          generate_release_notes: true
