name: Build CueZone APK

on:
  push:
    branches: [cuezone-app]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" | tail -3

      - name: Install packages
        run: npm ci

      - name: Build app and copy into Android project
        run: npm run build && npx cap sync android

      - name: Load the CueZone signing key
        env:
          KS: ${{ secrets.CUEZONE_KEYSTORE }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/cuezone.keystore"
            echo "CUEZONE_KS_PATH=$RUNNER_TEMP/cuezone.keystore" >> "$GITHUB_ENV"
            echo "Signing with the permanent CueZone key"
          else
            echo "::warning::CUEZONE_KEYSTORE secret is missing. This APK uses a temporary key and will not install as an update over older versions."
          fi

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../CueZone.apk

      - name: Upload APK (Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: CueZone-APK
          path: CueZone.apk

      - name: Publish as a release (direct phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cuezone-v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          name: CueZone v1.0.${{ github.run_number }}
          body: Install CueZone.apk on your Android phone (allow "Install unknown apps" when asked).
          files: CueZone.apk
