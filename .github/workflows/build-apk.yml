name: Build CueZone APK

on:
  push:
    branches: [cuezone-app]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install packages
        run: npm ci

      - name: Build app and copy into Android project
        run: npm run build && npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../CueZone.apk

      - name: Upload APK (Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: CueZone-APK
          path: CueZone.apk

      - name: Publish as a release (direct phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cuezone-v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          name: CueZone v1.0.${{ github.run_number }}
          body: Install CueZone.apk on your Android phone (allow "Install unknown apps" when asked).
          files: CueZone.apk
