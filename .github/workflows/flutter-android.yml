name: Build Flutter APK

# Builds the Flutter edition of the Lavi billing app.
# The Android host is generated by `flutter create` at build time, so it always
# matches the Flutter version doing the building; tool/prepare.py then layers
# this repository's app on top of it.

on:
  push:
    branches: ['**']
    paths:
      - 'flutter_app/**'
      - 'billing-app/**'
      - '.github/workflows/flutter-android.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Report the toolchain
        run: |
          flutter --version
          flutter doctor -v || true

      - name: Generate the Android host
        run: |
          flutter create \
            --org com.lavidhawa \
            --project-name lavi_billing \
            --platforms=android \
            --overwrite \
            build/flutter_shell

      - name: Layer this app onto the host
        run: |
          python3 -m pip install --quiet --disable-pip-version-check Pillow || true
          python3 flutter_app/tool/prepare.py build/flutter_shell

      - name: Resolve packages
        working-directory: build/flutter_shell
        run: flutter pub get

      - name: Analyse
        working-directory: build/flutter_shell
        run: flutter analyze --no-fatal-infos

      # Signing is optional. Add the four repository secrets and every build is
      # signed with your key, so updates install over the previous version.
      # Without them Flutter falls back to the debug key, which still installs.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            cat > build/flutter_shell/android/key.properties <<PROPS
          storeFile=$RUNNER_TEMP/release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
            if python3 flutter_app/tool/enable_signing.py build/flutter_shell; then
              echo "Release keystore ready."
            else
              echo "::warning::Could not wire the signing key into this Flutter version's Gradle files; the APK will be debug-signed."
            fi
          else
            echo "No KEYSTORE_BASE64 secret set — the APK will be debug-signed."
          fi

      - name: Build the release APK
        working-directory: build/flutter_shell
        run: flutter build apk --release

      - name: Name the APK
        id: apk
        run: |
          SRC=build/flutter_shell/build/app/outputs/flutter-apk/app-release.apk
          test -f "$SRC" || { echo "APK not found"; find build/flutter_shell/build -name '*.apk' || true; exit 1; }
          VERSION=$(grep -m1 '^version:' flutter_app/pubspec.yaml | sed -E 's/version:[[:space:]]*([^+]+).*/\1/' | tr -d ' ')
          if [ "${{ github.event_name }}" = "release" ]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          NAME="lavi-billing-flutter-v${VERSION}.apk"
          cp "$SRC" "$NAME"
          ls -la "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: lavi-billing-flutter-apk
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error
          retention-days: 90

      - name: Attach the APK to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.name }}
