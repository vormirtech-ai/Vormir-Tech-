name: lavi_billing
description: Offline billing, inventory, udhaar and attendance for Lavi The Dhawa & Family Restaurant.
publish_to: 'none'

# versionCode comes from the number after the +
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # The only third-party dependency: the WebView that hosts the billing system.
  # Printing, saving and file picking are handled by this project's own Android
  # code over a method channel, so there is nothing else to keep in step.
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.3.0

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # The billing system itself. tool/prepare.py copies billing-app/ here and
  # rewrites this list, so a new file can never be left out of the APK.
  assets:
    - assets/www/
    - assets/www/assets/css/
    - assets/www/assets/icons/
    - assets/www/assets/js/
    - assets/www/assets/js/views/
