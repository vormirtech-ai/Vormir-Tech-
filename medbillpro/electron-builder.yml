appId: com.vormirtech.medbillpro
productName: MedV
copyright: Copyright © 2026 Vormir Tech Solutions

directories:
  output: dist
  buildResources: build

files:
  - src/**/*
  - package.json
  - '!**/*.map'
  - '!tools/**'
  - '!tests/**'
  - '!docs/**'

asarUnpack:
  - '**/node_modules/better-sqlite3/**'

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.ico
  artifactName: MedBillPro_Setup.${ext}

# Code signing (optional but recommended — it removes the SmartScreen warning
# and the Smart App Control block on shop PCs). No change is needed here:
# export the two variables below and electron-builder signs the app and the
# installer automatically.
#
#   set CSC_LINK=C:\path\to\certificate.pfx
#   set CSC_KEY_PASSWORD=your-certificate-password
#   npm run dist
#
# For Azure Trusted Signing (~$10/month, trusted by Smart App Control straight
# away) upgrade to electron-builder 26+ and add an `azureSignOptions:` block.
# See docs/WINDOWS-SECURITY.md.

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: MedV
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  artifactName: MedBillPro_Setup.${ext}
  deleteAppDataOnUninstall: false

portable:
  artifactName: MedBillPro_Portable.${ext}

linux:
  target: [AppImage]
  icon: build/icon.png
  category: Office

mac:
  target: [dmg]
  icon: build/icon.png
  category: public.app-category.business
