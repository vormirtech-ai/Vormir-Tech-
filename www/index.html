<!doctype html>
<html lang="en">
<head>

<title>PlayDen Gaming Zone</title>

<style>:root{padding-top:var(--safe-area-inset-top,env(safe-area-inset-top,0px));padding-bottom:0}body{-webkit-user-select:none;user-select:none}input,textarea{-webkit-user-select:text;user-select:text}</style>
</head>
<body>


<style>
/* Layout: one-screen app — dark ink header with live stats, area filter, station grid; fixed bottom tab bar; bottom sheets for every action */
:root{
  --bg:#0F1218; --surface:#171B23; --surface-2:#1F2430; --fg:#EAEEF5; --muted:#8E98AA; --line:#2A3140;
  --accent:#FF6B3D; --accent-2:#FF8A63; --on-accent:#1C0A04; --accent-soft:#3A2018;
  --head:#0B0E13; --on-head:#F2F4F8; --head-tile:rgba(255,255,255,.07);
  --free:#3CCB7F; --play:#5B95FF; --warn:#F5B83D; --over:#FF5A5F; --pause:#9AA3B2; --booked:#B892FF;
  --free-soft:#123323; --play-soft:#16233F; --warn-soft:#3A2C0E; --over-soft:#3D1618; --booked-soft:#271D40;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.25); --scrim:rgba(0,0,0,.6);
  --display:"Chakra Petch","Rajdhani","Arial Narrow",sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px; color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F2F3F6; --surface:#FFFFFF; --surface-2:#EEF0F4; --fg:#11151C; --muted:#5D6677; --line:#DCE0E8;
  --accent:#E4521F; --accent-2:#F06A3A; --on-accent:#FFFFFF; --accent-soft:#FCE5DA;
  --head:#11151C; --on-head:#F4F6FA; --head-tile:rgba(255,255,255,.08);
  --free:#16904E; --play:#2B66D9; --warn:#A87000; --over:#D3353B; --pause:#6A7484; --booked:#7448D0;
  --free-soft:#DDF3E6; --play-soft:#E1EAFB; --warn-soft:#FBEFD2; --over-soft:#FBE2E3; --booked-soft:#ECE3FB;
  --shadow:0 1px 2px rgba(17,21,28,.06),0 4px 14px rgba(17,21,28,.07); --scrim:rgba(10,12,16,.45); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#F2F3F6; --surface:#FFFFFF; --surface-2:#EEF0F4; --fg:#11151C; --muted:#5D6677; --line:#DCE0E8;
  --accent:#E4521F; --accent-2:#F06A3A; --on-accent:#FFFFFF; --accent-soft:#FCE5DA;
  --head:#11151C; --on-head:#F4F6FA; --head-tile:rgba(255,255,255,.08);
  --free:#16904E; --play:#2B66D9; --warn:#A87000; --over:#D3353B; --pause:#6A7484; --booked:#7448D0;
  --free-soft:#DDF3E6; --play-soft:#E1EAFB; --warn-soft:#FBEFD2; --over-soft:#FBE2E3; --booked-soft:#ECE3FB;
  --shadow:0 1px 2px rgba(17,21,28,.06),0 4px 14px rgba(17,21,28,.07); --scrim:rgba(10,12,16,.45); color-scheme:light}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;margin:0;overscroll-behavior:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:var(--safe-area-inset-top,env(safe-area-inset-top,0px));z-index:30;background:var(--head)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Header */
.top{position:sticky;top:var(--safe-area-inset-top,env(safe-area-inset-top,0px));z-index:20;background:var(--head);color:var(--on-head);
  padding-left:max(16px,var(--safe-area-inset-left,env(safe-area-inset-left,0px)));padding-right:max(16px,var(--safe-area-inset-right,env(safe-area-inset-right,0px)));padding-block:12px 14px}
.top-row{display:flex;align-items:center;gap:12px}
.club{flex:1;min-width:0;font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.03em;line-height:1.1;text-transform:uppercase;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;text-wrap:balance}
.club b{color:var(--accent)}
.clock{font-family:var(--display);font-weight:600;font-size:18px;opacity:.9;white-space:nowrap}
.gear{width:38px;height:38px;border-radius:12px;background:var(--head-tile);display:grid;place-items:center;flex:none}
.gear[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.top-sub{font-size:13px;opacity:.7;margin-top:1px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.stat{background:var(--head-tile);border-radius:10px;padding:8px 9px;min-width:0}
.stat b{display:block;font-family:var(--display);font-size:22px;font-weight:700;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:10px;text-transform:uppercase;letter-spacing:.09em;opacity:.7}
.stat.hot b{color:var(--accent)}

main{padding-left:max(16px,var(--safe-area-inset-left,env(safe-area-inset-left,0px)));padding-right:max(16px,var(--safe-area-inset-right,env(safe-area-inset-right,0px)));padding-block:14px calc(96px + var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)));max-width:1000px;margin:0 auto}
.section-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 12px}
.section-h h2{font-family:var(--display);font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin:0}
.section-h small{color:var(--muted);font-size:13px}
.area-h{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 2px 10px}
.area-h:first-of-type{margin-top:6px}
.area-h span{margin-left:auto;font-family:var(--body);font-size:12px;letter-spacing:.02em;text-transform:none}
.demo-note{background:var(--warn-soft);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:14px;display:flex;gap:10px;justify-content:space-between;align-items:center}
.demo-note button{font-weight:600;text-decoration:underline;white-space:nowrap}

/* Station cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.grid.cabins{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.card{position:relative;text-align:left;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:13px 13px 12px;display:flex;flex-direction:column;gap:5px;border:1.5px solid var(--line);min-width:0;overflow:hidden}
.card[data-status="running"]{border-color:var(--play)}
.card[data-status="paused"]{border-color:var(--pause)}
.card[data-status="warn"]{border-color:var(--warn);background:var(--warn-soft)}
.card[data-status="over"]{border-color:var(--over);background:var(--over-soft);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--over) 25%,transparent)}}
@media (prefers-reduced-motion:reduce){.card[data-status="over"]{animation:none}}
.c-top{display:flex;align-items:center;justify-content:space-between;gap:6px}
.kind{font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--muted);white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.c-top .chip{flex:none}
.card.cabin .kind{background:var(--accent-soft);color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--free);flex:none}
[data-status="running"] .dot{background:var(--play)} [data-status="paused"] .dot{background:var(--pause)}
[data-status="warn"] .dot{background:var(--warn)} [data-status="over"] .dot{background:var(--over)}
.tname{font-family:var(--display);font-size:19px;font-weight:700;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer{font-family:var(--display);font-weight:700;font-size:32px;line-height:1;letter-spacing:.01em;font-variant-numeric:tabular-nums;margin-top:2px}
.card[data-status="free"] .timer{color:var(--muted);font-size:22px;font-weight:600;padding-top:4px}
.card[data-status="over"] .timer{color:var(--over)}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:12px;color:var(--muted);min-height:18px}
.meta .amt{font-weight:700;color:var(--fg);font-size:15px;white-space:nowrap}
.who{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;min-height:17px}
.who .nm{overflow:hidden;text-overflow:ellipsis;min-width:0}
.who svg.i{width:14px;height:14px}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:2px}
.bar i{display:block;height:100%;background:var(--play);border-radius:2px;transition:width .6s linear}
[data-status="warn"] .bar i{background:var(--warn)} [data-status="over"] .bar i{background:var(--over)} [data-status="paused"] .bar i{background:var(--pause)}
.bk{display:inline-flex;align-items:center;gap:5px;align-self:flex-start;font-size:11px;font-weight:700;padding:3px 8px;border-radius:7px;background:var(--booked-soft);color:var(--booked);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.bk svg.i{width:13px;height:13px}
.food-n{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-weight:600}

/* Tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);
  padding-left:max(6px,var(--safe-area-inset-left,env(safe-area-inset-left,0px)));padding-right:max(6px,var(--safe-area-inset-right,env(safe-area-inset-right,0px)));padding-block:6px calc(6px + var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px)))}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:600;color:var(--muted);position:relative;isolation:isolate}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--accent)}
.tab[aria-selected="true"]::before{content:"";position:absolute;top:2px;width:46px;height:30px;border-radius:15px;background:var(--accent-soft);z-index:-1}
.tab .badge{position:absolute;top:1px;left:calc(50% + 7px);background:var(--over);color:#fff;font-size:10px;border-radius:9px;padding:0 5px;line-height:16px;min-width:16px;text-align:center}

/* Generic UI */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:12px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);text-decoration:none;text-align:center}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.danger{color:var(--over)}
.btn.wa{background:#1FA855;color:#fff;border-color:transparent}
.btn.wa svg{width:20px;height:20px;fill:currentColor;flex:none}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.45}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 0;min-width:0}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.field>label,.lbl{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.input{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);padding:0 14px;font-size:16px;min-width:0}
select.input{appearance:auto}
textarea.input{padding:12px 14px;min-height:110px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:38px;padding:0 10px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{min-height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--line);background:var(--surface-2);font-weight:600;font-size:14px;white-space:nowrap}
.pill[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:transparent}
.pill small{font-weight:500;opacity:.75;margin-left:4px}
.list{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--line)}
.li{display:flex;align-items:center;gap:12px;padding:13px 14px;border-top:1px solid var(--line);width:100%;text-align:left;min-width:0;text-decoration:none}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .v{font-weight:700;text-align:right;white-space:nowrap}
.li.wrap{flex-wrap:wrap}.li.wrap .grow{min-width:150px}.li.wrap .s{white-space:normal}
.tag{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tag.credit{background:var(--over-soft);color:var(--over)} .tag.upi{background:var(--play-soft);color:var(--play)}
.tag.cash{background:var(--free-soft);color:var(--free)} .tag.card{background:var(--warn-soft);color:var(--warn)}
.tag.new{background:var(--over-soft);color:var(--over)} .tag.prep{background:var(--warn-soft);color:var(--warn)} .tag.served{background:var(--free-soft);color:var(--free)}
.tag.booked{background:var(--booked-soft);color:var(--booked)}
.empty{text-align:center;color:var(--muted);padding:34px 16px;font-size:14px}
.empty b{display:block;color:var(--fg);font-family:var(--display);font-size:19px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.group-h{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:18px 2px 8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.toggle{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.toggle[aria-checked="true"]{background:var(--accent)}
.toggle[aria-checked="true"]::after{transform:translateX(18px)}
.stepper{display:inline-flex;align-items:center;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;flex:none}
.stepper button{width:36px;height:36px;font-size:20px;font-weight:600;color:var(--accent)}
.stepper span{min-width:24px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}

/* Kitchen + bookings */
.ocard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.ocard[data-st="new"]{border-left:4px solid var(--over)} .ocard[data-st="prep"]{border-left:4px solid var(--warn)} .ocard[data-st="served"]{border-left:4px solid var(--free)}
.o-top{display:flex;align-items:center;gap:10px;justify-content:space-between}
.o-top b{font-family:var(--display);font-size:18px}
.o-items{display:flex;flex-direction:column;gap:2px;font-size:14px}
.o-items div{display:flex;justify-content:space-between;gap:10px}
.o-note{font-size:13px;background:var(--surface-2);border-radius:8px;padding:6px 9px}
.olist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.bcard{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;min-width:0}
.bcard .when{flex:none;width:80px;white-space:nowrap;text-align:center;border-right:1px solid var(--line);padding-right:10px}
.bcard .when b{display:block;font-family:var(--display);font-size:20px;line-height:1.05}
.bcard .when span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.bcard .grow{flex:1;min-width:0}
.bcard .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bcard .s{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stack{display:flex;flex-direction:column;gap:10px}
.banner{display:flex;align-items:center;gap:10px;background:var(--booked-soft);color:var(--fg);border-radius:12px;padding:10px 12px;margin-bottom:14px;font-size:14px}
.banner .grow{flex:1;min-width:0}

/* Menu picker */
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px;margin-bottom:14px}
.item{position:relative;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);min-width:0}
.item b{display:block;font-weight:600;font-size:14px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:2.5em}
.item span{font-size:13px;color:var(--muted)}
.item .q{position:absolute;top:6px;right:6px;background:var(--accent);color:var(--on-accent);border-radius:10px;min-width:20px;height:20px;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.item.has{border-color:var(--accent);background:var(--accent-soft)}
.cart{position:sticky;bottom:0;background:var(--surface);padding-top:10px;margin-top:6px;border-top:1px solid var(--line)}

/* Sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;opacity:0;transition:opacity .2s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:20px 20px 0 0;max-height:92%;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-width:640px;margin:0 auto;box-shadow:0 -8px 30px rgba(0,0,0,.3)}
.sheet.show{transform:none}
@media (prefers-reduced-motion:reduce){.sheet,.scrim{transition:none}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px max(16px,var(--safe-area-inset-right,env(safe-area-inset-right,0px))) 10px max(16px,var(--safe-area-inset-left,env(safe-area-inset-left,0px)));border-bottom:1px solid var(--line)}
.sheet-h h3{margin:0;font-family:var(--display);font-size:21px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-h .x{width:36px;height:36px;border-radius:18px;background:var(--surface-2);font-size:20px;line-height:1;flex:none}
.sheet-b{overflow-y:auto;padding:16px max(16px,var(--safe-area-inset-right,env(safe-area-inset-right,0px))) calc(20px + var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px))) max(16px,var(--safe-area-inset-left,env(safe-area-inset-left,0px)))}
.big-timer{font-family:var(--display);font-weight:700;font-size:60px;line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.big-sub{text-align:center;color:var(--muted);font-size:14px;margin:6px 0 14px}
.sum{border-radius:12px;background:var(--surface-2);padding:4px 14px;margin-bottom:14px}
.sum>div{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-top:1px dashed var(--line);font-variant-numeric:tabular-nums;min-height:38px}
.sum>div:first-child{border-top:0}
.sum>div>span:first-child{min-width:0}
.sum .tot{font-weight:700;font-size:18px;border-top:1px solid var(--line)}
.sum .minus{color:var(--free)}
.receipt{background:var(--surface-2);border-radius:12px;padding:16px;font-size:14px;margin-bottom:14px}

/* ---------- Session maths ---------- */
function SID(id){for(var i=0;i<S.stations.length;i++)if(S.stations[i].id===id)return S.stations[i];return null}
function elapsed(s,now){now=now||Date.now();return (s.pausedAt||now)-s.start-s.pausedMs}
function remaining(s,now){return s.limit*60000-elapsed(s,now)}
function statusOf(st,now){var s=st.s;if(!s)return 'free';if(s.pausedAt)return 'paused';if(s.mode==='fixed'){var r=remaining(s,now);if(r<=0)return 'over';if(r<=S.settings.warnMin*60000)return 'warn'}return 'running'}
function rateFor(s,p){return s.rate+Math.max(0,p-s.incl)*s.extra}
function inHappy(t){var h=S.settings.happy;if(!h||!h.on)return false;var d=new Date(t),hr=d.getHours()+d.getMinutes()/60,day=d.getDay();if(h.weekdays&&(day===0||day===6))return false;return hr>=h.from&&hr<h.to}
function calc(st,endAt){
  var s=st.s,ms=endAt?((s.pausedAt||endAt)-s.start-s.pausedMs):elapsed(s);ms=Math.max(0,ms);
  var r=S.settings.round||1,bm=Math.max(r,Math.ceil(ms/60000/r-1e-9)*r);
  if(s.mode==='fixed'&&S.settings.bookedMin)bm=Math.max(bm,s.limit);
  var billedMs=bm*60000,segs=s.segs.slice().sort(function(a,b){return a.t-b.t}),cost=0,parts={};
  for(var i=0;i<segs.length;i++){var from=Math.min(segs[i].t,billedMs),to=i+1<segs.length?Math.min(segs[i+1].t,billedMs):billedMs;if(to<=from)continue;
    var p=segs[i].p;cost+=(to-from)/3600000*rateFor(s,p);parts[p]=(parts[p]||0)+(to-from)}
  var happy=inHappy(s.start)?Math.round(cost*S.settings.happy.pct/100):0;
  var sc=Math.max(s.minCharge||0,Math.round(cost-happy));
  var it=s.items.reduce(function(a,b){return a+b.price*b.qty},0);
  var pk=Object.keys(parts).map(Number).sort(function(a,b){return a-b});
  var partsText=pk.map(function(p){return p+' player'+(p>1?'s':'')+(pk.length>1?' · '+durStr(parts[p]):'')}).join(', ');
  return {ms:ms,billedMin:bm,cost:Math.round(cost),happy:happy,stationCharge:sc,itemsTotal:it,advance:s.advance||0,total:sc+it,partsText:partsText,minApplied:sc===(s.minCharge||0)&&Math.round(cost-happy)<sc};
}
function setPlayers(st,p){var s=st.s;p=Math.max(1,Math.min(st.maxP||20,p));if(p===s.players)return;var el=elapsed(s),last=s.segs[s.segs.length-1];
  if(el-last.t<60000)last.p=p;else s.segs.push({t:el,p:p});s.players=p;save()}

var AC=null;

  if(!S.settings.sound||!AC)return;
  var seq=kind==='end'?[880,0,880,0,880,0,1175]:kind==='warn'?[660,0,880]:kind==='food'?[988,1319]:[740];var t=AC.currentTime+.02;
  seq.forEach(function(f){if(f){var o=AC.createOscillator(),g=AC.createGain();o.type=kind==='food'?'triangle':'sine';o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(.35,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.22);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.25)}t+=.18});
}

function cancelIds(ids){if(!LN||!ids.length)return;LN.cancel({notifications:ids.map(function(i){return {id:i}})}).catch(function(){})}
function stIds(st){var a=[];for(var k=0;k<20;k++)a.push((st.nid||1)*100+k);return a}

function scheduleNative(st){
  if(!LN)return;cancelNative(st);var s=st.s;if(!s||s.pausedAt||!S.settings.notify)return;
  var now=Date.now(),list=[],base=(st.nid||1)*100,who=s.customer?(' · '+s.customer):'';

  if(s.mode==='fixed'){var rem=remaining(s,now);
    if(S.settings.warnMin>0)add(base+1,now+rem-S.settings.warnMin*60000,st.name+': '+S.settings.warnMin+' min left','Booked '+minsLabel(s.limit)+who);
    add(base+2,now+rem,'Time up on '+st.name,minsLabel(s.limit)+' session ended'+who+'. Extend or bill.');
  }else if(S.settings.remindEvery>0){var every=S.settings.remindEvery*60000,el=elapsed(s,now),next=(Math.floor(el/every)+1)*every;
    for(var k=0;k<8;k++)add(base+10+k,now+(next+k*every-el),st.name+' running '+durStr(next+k*every),'Open session'+who);}

}

/* ---------- Ticker ---------- */
function tick(force){
  var now=Date.now(),dirty=false;
  S.stations.forEach(function(st){
    var s=st.s;if(!s)return;var stt=statusOf(st,now);
    if(!s.pausedAt){
      if(s.mode==='fixed'){
        if(stt==='warn'&&!s.fired.warn&&S.settings.warnMin>0){s.fired.warn=true;dirty=true;beep('warn');buzz('warn');toast('warn',S.settings.warnMin+' min left on '+st.name,s.customer||'Tap to open',function(){setTab('stations');openStation(st.id)});webNotify(st.name+': '+S.settings.warnMin+' min left',s.customer||'')}
        if(stt==='over'&&!s.fired.end){s.fired.end=true;s.fired.warn=true;dirty=true;beep('end');buzz('end');timeUpModal(st);webNotify('Time up on '+st.name,'Extend or bill the session')}
      }else if(S.settings.remindEvery>0){var n=Math.floor(elapsed(s,now)/(S.settings.remindEvery*60000));
        if(n>(s.fired.rem||0)){s.fired.rem=n;dirty=true;beep('remind');toast('info',st.name+' has run '+durStr(n*S.settings.remindEvery*60000),'Running bill '+money(calc(st).total),function(){setTab('stations');openStation(st.id)});webNotify(st.name+' running '+durStr(n*S.settings.remindEvery*60000),'')}}
    }
    $$('[data-sid="'+st.id+'"]').forEach(function(el){var k=el.dataset.k;
      if(k==='card'){if(el.dataset.status!==stt)el.dataset.status=stt}
      else if(k==='clock'){el.textContent=s.mode==='fixed'&&stt!=='over'?clockStr(remaining(s,now)):clockStr(stt==='over'?-remaining(s,now):elapsed(s,now))}
      else if(k==='label'){el.textContent=STATUS_LABEL[stt]}
      else if(k==='amt'){el.textContent=money(calc(st).total)}
      else if(k==='sub'){el.textContent=subLine(st,stt,now)}
      else if(k==='bar'){el.style.width=barPct(st,now)+'%'}
      else if(k==='elapsed'){el.textContent=clockStr(elapsed(s,now))}
      else if(k==='sc'){el.textContent=money(calc(st).stationCharge)}
      else if(k==='over'){el.textContent='Over by '+clockStr(-remaining(s,now))}
    });
  });
  var lead=S.settings.bookingRemind*60000;
  S.bookings.forEach(function(b){
    if(b.status!=='upcoming')return;var st=SID(b.sid),nm=st?st.name:'Station';
    if(!b.fr&&now>=b.at-lead&&now<b.at+30*60000){b.fr=true;dirty=true;beep('warn');buzz('warn');toast('booked','Booking at '+timeStr(b.at)+' · '+nm,b.name+' · '+b.players+' players',function(){setTab('bookings');bookingDetail(b)});webNotify('Booking at '+timeStr(b.at),nm+' · '+b.name)}
    if(!b.fa&&now>=b.at&&now<b.at+30*60000){b.fa=true;dirty=true;
      if(st&&st.s){beep('warn');toast('warn',nm+' is booked now','Current session is still running. '+b.name+' is due.',function(){setTab('stations');openStation(st.id)})}
      else toast('booked',b.name+' is due now',nm+' · tap to start',function(){setTab('bookings');bookingDetail(b)})}
  });
  var c=$('#clock');if(c)c.textContent=timeStr(now);
  if(dirty){save();if(!$('#sheet').hidden)return;renderTop()}
  if(force)renderTop();
}
function subLine(st,stt,now){var s=st.s;if(stt==='paused')return 'Paused';if(s.mode==='fixed')return stt==='over'?'Over · '+minsLabel(s.limit):'Left of '+minsLabel(s.limit);return 'Open time'}
function barPct(st,now){var s=st.s;if(s.mode==='fixed')return Math.min(100,elapsed(s,now)/(s.limit*60000)*100);var e=S.settings.remindEvery||60;return (elapsed(s,now)%(e*60000))/(e*60000)*100}

function extend(st,m){var s=st.s;if(!s)return;if(s.mode!=='fixed'){s.mode='fixed';s.limit=Math.ceil(elapsed(s)/60000)}s.limit+=m;s.fired.end=remaining(s)<=0;s.fired.warn=remaining(s)<=S.settings.warnMin*60000;save();scheduleNative(st);refresh()}
function limitSheet(st){var s=st.s,cur=Math.ceil(elapsed(s)/60000);

    $$('#l-p .pill',sh).forEach(function(b){b.onclick=function(){s.mode='fixed';s.limit=+b.dataset.v;s.fired.end=false;s.fired.warn=remaining(s)<=S.settings.warnMin*60000;save();scheduleNative(st);runningSheet(st);refresh()}})})}
function moveSheet(st){
  var free=S.stations.filter(function(x){return !x.s});
  openSheet('Move '+esc(st.name)+' to',free.length?'<div class="list">'+free.map(function(f){return '<button class="li" data-to="'+f.id+'"><div class="grow"><div class="t">'+esc(f.name)+'</div><div class="s">'+esc(f.kind)+(f.area==='cabin'?' · Cabin':' · Open area')+'</div></div><span class="s">'+money(f.rate)+'/hr</span></button>'}).join('')+'</div><p class="note" style="margin-top:12px">Time played so far keeps its old rate. The new station\'s rate applies from now.</p>':'<div class="empty"><b>No free station</b>Everything is in use right now.</div>',function(sh){
    $$('[data-to]',sh).forEach(function(b){b.onclick=function(){var to=SID(b.dataset.to),s=st.s;cancelNative(st);

/* ---------- Food ordering ---------- */
function OID(id){for(var i=0;i<S.orders.length;i++)if(S.orders[i].id===id)return S.orders[i];return null}

function orderSheet(target){
  var st=target.sid?SID(target.sid):null,cart={},note='',cat='',toKitchen=!!S.settings.kitchenPhone&&S.settings.kotAuto!==false;
  var body='<div class="cats" id="o-cats"><button class="pill" data-v="" aria-pressed="true">All</button>'+cats().map(function(c){return '<button class="pill" data-v="'+esc(c)+'" aria-pressed="false">'+esc(c)+'</button>'}).join('')+'</div>'+
   '<div class="items" id="o-items">'+S.menu.map(function(m){return '<button class="item" data-mid="'+m.id+'" data-cat="'+esc(m.cat||'')+'"><b>'+esc(m.name)+'</b><span>'+money(m.price)+'</span></button>'}).join('')+'</div>'+
   (S.menu.length?'':'<div class="empty"><b>Menu is empty</b>Add food items in Settings → Food menu.</div>')+
   '<div id="o-cart"></div>'+
   (!st?'<div class="field"><label for="o-cust">Customer or table name</label><input class="input" id="o-cust" placeholder="e.g. Takeaway · Imran" autocomplete="off"></div>':'')+

function BID(id){for(var i=0;i<S.bookings.length;i++)if(S.bookings[i].id===id)return S.bookings[i];return null}
var bookView='upcoming';
function renderBookings(){
  var now=Date.now(),up=S.bookings.filter(function(b){return b.status==='upcoming'}).sort(function(a,b){return a.at-b.at});

/* ---------- Payment QR ---------- */
function getQr(){try{return localStorage.getItem(QR_KEY)||''}catch(e){return ''}}
function qrSource(){var up=getQr();if(up&&(S.settings.qrMode!=='auto'||!S.settings.upi))return {kind:'upload',src:up};if(S.settings.upi&&typeof window.qrcode==='function')return {kind:'auto'};if(up)return {kind:'upload',src:up};return null}
function upiLink(amount){return 'upi://pay?pa='+encodeURIComponent(S.settings.upi)+'&pn='+encodeURIComponent(S.settings.club)+(amount?'&am='+amount:'')+'&cu=INR&tn='+encodeURIComponent('Gaming bill')}
function upiModules(amount){var q=window.qrcode(0,'M');q.addData(upiLink(amount));q.make();return q}
function qrGraphic(amount){var src=qrSource();if(!src)return '';if(src.kind==='upload')return '<img src="'+src.src+'" alt="Payment QR code">';try{return upiModules(amount).createSvgTag({cellSize:4,margin:2,scalable:true})}catch(e){return ''}}
function payQrCard(amount,each){
  var src=qrSource();
  if(!src)return '<div class="sum" style="padding:12px 14px"><b>No payment QR yet</b><p class="note" style="margin:4px 0 10px">Upload your PhonePe, GPay or Paytm QR once and it shows here at every UPI bill.</p><button class="btn sm primary" data-goqr>Add payment QR</button></div>';
  return '<button class="payqr" data-qrfull="'+amount+'" data-each="'+(each||0)+'">'+qrGraphic(amount)+'<div class="amt">Pay '+money(amount)+'</div>'+(each?'<div class="sub">'+money(each)+' each</div>':'')+
    '<div class="sub">'+(src.kind==='auto'?'Amount fills in automatically · '+esc(S.settings.upi):'Customer types '+money(each||amount)+' after scanning')+'</div><span class="zoom">Tap to show full screen</span></button>';
}
function showQrFull(amount,each){var w=document.createElement('div');w.className='qr-full';w.setAttribute('role','dialog');
  w.innerHTML='<div class="club">'+esc(S.settings.club)+'</div>'+qrGraphic(amount)+'<div class="amt">Pay '+money(each||amount)+'</div>'+(each?'<div>'+money(amount)+' total, split '+Math.round(amount/each)+' ways</div>':'')+'<button>Done</button>';
  w.querySelector('button').onclick=function(){w.remove()};document.body.appendChild(w)}
function bindQr(root){
  $$('[data-qrfull]',root).forEach(function(b){b.onclick=function(){showQrFull(+b.dataset.qrfull,+b.dataset.each)}});
  $$('[data-goqr]',root).forEach(function(b){b.onclick=function(){setTab('settings');setTimeout(function(){var el=$('#s-qr');if(el)el.scrollIntoView({block:'center'})},50)}});
}
function pickQrImage(done){
  var inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.style.display='none';document.body.appendChild(inp);
  inp.onchange=function(){var f=inp.files&&inp.files[0];inp.remove();if(!f)return;var rd=new FileReader();rd.onload=function(){var img=new Image();img.onload=function(){
      var max=900,sc=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
      var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
      try{localStorage.setItem(QR_KEY,c.toDataURL('image/jpeg',0.92));S.settings.qrMode='upload';save();done(true)}catch(e){toast('warn','Could not save the QR','The picture is too large. Crop it to just the QR and try again.')}};
    img.onerror=function(){toast('warn','That file is not a picture','Choose a photo or screenshot of your QR')};img.src=rd.result};rd.readAsDataURL(f)};
  inp.click();
}

/* ---------- Bills, WhatsApp, bill picture ---------- */
function cleanPhone(v){var p=String(v||'').replace(/\D/g,'');if(p.length===11&&p[0]==='0')p=p.slice(1);if(p.length===10)p='91'+p;return p}
function billText(b){
  var L=['*'+S.settings.club+'*','Bill #'+b.no+' · '+dateStr(b.end)];
  if(b.kind==='station'){L.push(b.station+' ('+b.stKind+') · '+timeStr(b.start)+' – '+timeStr(b.end));if(b.game)L.push('Game: '+b.game);
    L.push('Play time: '+durStr(b.playMs)+' · '+b.partsText+' = '+money(b.playCharge));if(b.happy)L.push('Happy hours: −'+money(b.happy));if(b.stationCharge!==b.playCharge-b.happy)L.push('Minimum charge: '+money(b.stationCharge))}
  b.items.forEach(function(it){L.push(it.name+(it.qty>1?' × '+it.qty:'')+' = '+money(it.price*it.qty))});
  if(b.discount)L.push('Discount: −'+money(b.discount));
  L.push('*Total: '+money(b.total)+'*');
  if(b.advance)L.push('Advance paid: −'+money(b.advance),'*Balance: '+money(b.due)+'*');
  if(b.split>1)L.push('Split '+b.split+' ways: '+money(Math.ceil(b.due/b.split))+' each');
  L.push(b.paid?('Paid by '+b.pay):'Added to credit (khata). Please pay at the counter.');
  if(!b.paid&&S.settings.upi)L.push('Pay by UPI to: '+S.settings.upi);
  L.push('Thanks for gaming with us!');return L.join('\n');

/* ---------- Activation key ---------- */
var LIC_HASHES=['73aa64966943cd11aab63fd3ae8e8468afcc9b4199e57120d2af11290127371d'];
function sha256(str){
  var K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  var H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  var b=unescape(encodeURIComponent(str)),n=b.length,words=[],i;
  for(i=0;i<n;i++)words[i>>2]|=(b.charCodeAt(i)&255)<<(24-(i%4)*8);
  words[n>>2]|=0x80<<(24-(n%4)*8);words[((n+8)>>6<<4)+15]=n*8;
  var W=new Array(64);
  for(var j=0;j<words.length;j+=16){
    var a=H[0],bb=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(i=0;i<64;i++){
      if(i<16)W[i]=words[j+i]|0;else{var x=W[i-15],y=W[i-2];W[i]=(((x>>>7|x<<25)^(x>>>18|x<<14)^(x>>>3))+W[i-7]+((y>>>17|y<<15)^(y>>>19|y<<13)^(y>>>10))+W[i-16])|0}
      var t1=(h+((e>>>6|e<<26)^(e>>>11|e<<21)^(e>>>25|e<<7))+((e&f)^(~e&g))+K[i]+W[i])|0;
      var t2=(((a>>>2|a<<30)^(a>>>13|a<<19)^(a>>>22|a<<10))+((a&bb)^(a&c)^(bb&c)))|0;
      h=g;g=f;f=e;e=(d+t1)|0;d=c;c=bb;bb=a;a=(t1+t2)|0;
    }
    H[0]=(H[0]+a)|0;H[1]=(H[1]+bb)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0;
  }
  return H.map(function(v){return ('00000000'+(v>>>0).toString(16)).slice(-8)}).join('');
}
function cleanKey(v){return String(v||'').toUpperCase().replace(/[^0-9A-F]/g,'')}
function keyOk(k){k=cleanKey(k);return k.length===64&&LIC_HASHES.indexOf(sha256(k))>=0}
function storedKey(){try{return localStorage.getItem(LIC_KEY)||''}catch(e){return ''}}
function licensed(){return !!window.PLAYDEN_DEMO||keyOk(storedKey())}
function showLock(){
  ['#top','#main','#tabs'].forEach(function(q){$(q).hidden=true});
  var w=document.createElement('section');w.className='lock';w.id='lock';
  w.innerHTML='<div class="logo" aria-hidden="true">'+TAB_IC.stations+'</div><div><h1>Activate PlayDen</h1></div>'+
   '<p>Enter the 64-character activation key you received with the app. You only need to do this once on this phone.</p>'+
   '<label for="lk" class="lbl">Activation key</label>'+
   '<textarea id="lk" spellcheck="false" autocomplete="off" autocapitalize="characters" placeholder="XXXXXXXX-XXXXXXXX-XXXXXXXX-XXXXXXXX-XXXXXXXX-XXXXXXXX-XXXXXXXX-XXXXXXXX"></textarea>'+
   '<div class="count"><span id="lk-n">0 / 64</span><span>Letters A–F and numbers 0–9</span></div><div class="err" id="lk-err" role="alert"></div>'+
   '<button class="btn primary block" id="lk-go" disabled>Activate</button><p style="font-size:13px">No key? Contact Vormir Tech Solutions.</p>';
  document.body.appendChild(w);
  var ta=$('#lk'),go=$('#lk-go'),err=$('#lk-err'),n=$('#lk-n');
  ta.oninput=function(){var k=cleanKey(ta.value);n.textContent=k.length+' / 64';n.className=k.length===64?'ok':'';go.disabled=k.length!==64;err.textContent=k.length>64?'That is longer than 64 characters. Check for extra text.':''};
  go.onclick=function(){var k=cleanKey(ta.value);if(!keyOk(k)){err.textContent='This key is not valid. Check it and try again.';ta.focus();return}
    try{localStorage.setItem(LIC_KEY,k)}catch(e){}w.remove();['#top','#main','#tabs'].forEach(function(q){$(q).hidden=false});boot();toast('ok','PlayDen activated','Set up your stations and menu in Settings.')};
  setTimeout(function(){ta.focus()},300);
}

function boot(){
  render();

}
if(licensed())boot();else showLock();
